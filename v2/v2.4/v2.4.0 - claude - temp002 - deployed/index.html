<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F0F4F8" />

    <!-- v2.3.6: resolve the real theme BEFORE first paint, synchronously,
         so there's no flash of the wrong theme for returning visitors.
         Default (no saved preference) is always 'light'. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme') || 'light';
          var resolved = saved === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : saved;
          document.documentElement.setAttribute('data-theme', resolved);
          if (resolved === 'dark') document.documentElement.classList.add('dark');
        } catch (e) { /* localStorage unavailable -- stays on the light default above */ }
      })();
    </script>

    <!-- Favicon -->
    <link rel="icon"             type="image/x-icon"    href="/favicon.ico" />
    <link rel="icon"             type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon"             type="image/png" sizes="16x16" href="/favicon-16x16.png" />
