  <!-- Theme init (prevent flash) -->
  <script>
    (function () {
      try {
        var stored = JSON.parse(localStorage.getItem('mdturzo_theme'));
        if (stored === 'dark' || stored === 'light') {
          document.documentElement.setAttribute('data-theme', stored);
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
      // Redirect /index.html → /
      if (window.location.pathname === '/index.html') {
        window.history.replaceState(null, '', '/');
      }
    })();
  </script>
</head>

<body>

  <!-- ── Navbar ─────────────────────────────────────────────────── -->

          <div class="skeleton skeleton--rect" style="width:120px;height:24px;border-radius:999px;"></div>
          <div class="skeleton skeleton--title" style="width:65%;margin-top:0.5rem;"></div>
          <div class="skeleton skeleton--title" style="width:50%;"></div>
          <div class="skeleton skeleton--text" style="width:40%;"></div>
          <div class="skeleton skeleton--text" style="width:75%;"></div>
          <div class="skeleton skeleton--text" style="width:68%;"></div>
          <div style="display:flex;gap:0.75rem;margin-top:0.25rem;">
            <div class="skeleton skeleton--rect" style="width:110px;height:40px;border-radius:10px;"></div>
            <div class="skeleton skeleton--rect" style="width:130px;height:40px;border-radius:10px;"></div>
          </div>
          <div style="display:flex;gap:0.5rem;margin-top:0.25rem;">
            <div class="skeleton skeleton--circle" style="width:32px;height:32px;"></div>
            <div class="skeleton skeleton--circle" style="width:32px;height:32px;"></div>
            <div class="skeleton skeleton--circle" style="width:32px;height:32px;"></div>
            <div class="skeleton skeleton--circle" style="width:32px;height:32px;"></div>
          </div>
        </div>
        <div class="hero-skeleton__visual">
          <div class="skeleton skeleton--rect" style="width:100%;height:100%;border-radius:16px;"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- ── Footer ─────────────────────────────────────────────────── -->

    <!-- Rendered by footer.js -->

  <!-- Scripts -->
  <script src="/assets/js/site-config.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/router.js"></script>
  <script src="/assets/js/navbar.js"></script>
  <script src="/assets/js/footer.js"></script>
  <script src="/assets/js/home/hero.js"></script>
  <script src="/assets/js/home/skills.js"></script>
  <script src="/assets/js/home/about-mini.js"></script>

  <script type="module" src="/assets/js/app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (typeof Navbar !== 'undefined') Navbar.init();
      if (typeof Footer !== 'undefined') Footer.init();
    });
  </script>

</body>
