<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Muhtasim Rahman</title>
  <meta name="robots" content="noindex, nofollow" />

  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="/assets/images/favicon/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon/favicon-32x32.png" />
  <meta name="theme-color" content="#2563EB" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/assets/css/style.css" />

  <!-- Theme init -->
  <script>
    (function() {
      try {
        var t = JSON.parse(localStorage.getItem('mdturzo_theme'));
        if (t) document.documentElement.setAttribute('data-theme', t);
        else if (window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', 'dark');
      } catch(e) {}

      /* Redirect /index.html → / */
      if (window.location.pathname === '/index.html') {
        window.location.replace('/');
      }
    })();
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg-page); }

    .nf {
      min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding: 2rem; position: relative; overflow: hidden;
    }

    /* Blobs */
    .nf__blob {
      position: absolute; border-radius: 50%; pointer-events: none; filter: blur(70px);
    }
    .nf__blob--a { width: 360px; height: 360px; background: var(--accent-light); top:-100px; left:-80px; opacity:0.7; }
    .nf__blob--b { width: 280px; height: 280px; background: var(--accent-light); bottom:-80px; right:-60px; opacity:0.5; }

    .nf__card {
      position: relative; z-index: 1;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 1.5rem;
      padding: clamp(2rem, 5vw, 3rem) clamp(1.5rem, 5vw, 3rem);
      max-width: 440px; width: 100%;
      text-align: center;
      box-shadow: var(--shadow-xl);
      animation: nf-in 0.7s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes nf-in {
      from { opacity:0; transform: scale(0.94) translateY(20px); }
      to   { opacity:1; transform: scale(1) translateY(0); }
    }

    .nf__code {
      font-family: var(--font-display); font-weight: 800;
      font-size: clamp(4rem,15vw,7rem); line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, var(--clr-primary-500), var(--clr-primary-700));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 0.25rem;
    }
    .nf__icon { font-size: 1.8rem; color: var(--accent-primary); margin-bottom: 1rem; display: block; }
    .nf__title {
      font-family: var(--font-display); font-size: clamp(1.1rem,3vw,1.35rem);
      font-weight: 700; color: var(--text-primary); margin-bottom: 0.5rem;
    }
    .nf__desc { font-size: 0.875rem; color: var(--text-secondary); line-height: 1.6; margin-bottom: 1.75rem; }

    .nf__path {
      display: inline-flex; align-items: center; gap: 0.4rem;
      font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-tertiary);
      background: var(--bg-surface-2); border: 1px solid var(--border-color);
      padding: 0.3rem 0.7rem; border-radius: 0.5rem;
      margin-bottom: 1.75rem; max-width: 100%; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }

    .nf__actions { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; margin-bottom: 1.75rem; }
    .nf-btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.6rem 1.25rem;
      font-family: var(--font-body); font-size: 0.875rem; font-weight: 600;
      border-radius: 0.75rem; border: 1.5px solid transparent;
      cursor: pointer; transition: all 0.2s ease; text-decoration: none;
      background: none;
    }
    .nf-btn--primary { background: var(--accent-primary); color: #fff; border-color: var(--accent-primary); box-shadow: 0 2px 10px rgba(37,99,235,0.25); }
    .nf-btn--primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
    .nf-btn--outline { color: var(--accent-primary); border-color: var(--border-color); }
    .nf-btn--outline:hover { background: var(--accent-light); border-color: var(--accent-primary); }

    .nf__sugg { border-top: 1px solid var(--border-color); padding-top: 1.25rem; }
    .nf__sugg-lbl { font-size: 0.7rem; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.6rem; }
    .nf__sugg-links { display: flex; gap: 0.4rem; justify-content: center; flex-wrap: wrap; }
    .nf__sugg-link {
      display: inline-flex; align-items: center; gap: 0.3rem;
      padding: 0.28em 0.75em; font-size: 0.78rem; font-weight: 500;
      color: var(--text-secondary);
      background: var(--bg-surface-2); border: 1px solid var(--border-color);
      border-radius: 2rem; text-decoration: none; transition: all 0.18s ease;
    }
    .nf__sugg-link:hover { color: var(--accent-primary); border-color: var(--accent-primary); background: var(--accent-light); }
  </style>
</head>
<body>
  <div class="nf" role="main">
    <div class="nf__blob nf__blob--a" aria-hidden="true"></div>
    <div class="nf__blob nf__blob--b" aria-hidden="true"></div>

    <div class="nf__card">
      <span class="nf__code">404</span>
      <i class="fa-solid fa-compass nf__icon" aria-hidden="true"></i>
      <h1 class="nf__title">Page Not Found</h1>
      <p class="nf__desc">The page you're looking for doesn't exist or has been moved.</p>

      <div class="nf__path" id="nf-path" aria-live="polite">
        <i class="fa-solid fa-link-slash" aria-hidden="true"></i>
        <span id="nf-path-text"></span>
      </div>

      <div class="nf__actions">
        <a href="/" class="nf-btn nf-btn--primary">
          <i class="fa-solid fa-house" aria-hidden="true"></i> Go Home
        </a>
        <button onclick="history.back()" class="nf-btn nf-btn--outline">
          <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Go Back
        </button>
      </div>

      <div class="nf__sugg">
        <p class="nf__sugg-lbl">Quick links</p>
        <div class="nf__sugg-links">
          <a href="/about"    class="nf__sugg-link"><i class="fa-solid fa-user"    aria-hidden="true"></i> About</a>
          <a href="/projects" class="nf__sugg-link"><i class="fa-solid fa-code"    aria-hidden="true"></i> Projects</a>
          <a href="/blogs"    class="nf__sugg-link"><i class="fa-solid fa-pen-nib" aria-hidden="true"></i> Blogs</a>
          <a href="/contact"  class="nf__sugg-link"><i class="fa-solid fa-envelope"aria-hidden="true"></i> Contact</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    var el = document.getElementById('nf-path-text');
    if (el) el.textContent = window.location.pathname || '/unknown';
  </script>
</body>
</html>
