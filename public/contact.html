<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact | Muhtasim Rahman</title>
</head>
<body>
    <main id="app">
        <section class="py-20 px-4 max-w-4xl mx-auto">
            <h1 class="text-4xl font-bold text-primary mb-8 text-center">Get In Touch</h1>
            <p class="text-center text-gray-500 mb-12">Have a project in mind or just want to say hi? Feel free to reach out!</p>
            
            <div class="grid md:grid-cols-2 gap-12">
                <div class="space-y-8">
                    <div class="flex items-start space-x-4">
                        <div class="bg-primary/10 p-3 rounded-lg text-primary">
                            <span>📧</span>
                        </div>
                        <div>
                            <h4 class="font-bold">Email</h4>
                            <p class="text-sm text-gray-500">mdturzo.dev@gmail.com</p>
                        </div>
                    </div>
                    <div class="flex items-start space-x-4">
                        <div class="bg-accent/10 p-3 rounded-lg text-accent">
                            <span>📍</span>
                        </div>
                        <div>
                            <h4 class="font-bold">Location</h4>
                            <p class="text-sm text-gray-500">Saidpur, Nilphamari, Bangladesh</p>
                        </div>
                    </div>
                    <div class="flex items-start space-x-4">
                        <div class="bg-blue-500/10 p-3 rounded-lg text-blue-500">
                            <span>🔗</span>
                        </div>
                        <div>
                            <h4 class="font-bold">Social Media</h4>
                            <div class="flex space-x-4 mt-2">
                                <a href="https://facebook.com/mdturzo999" class="hover:text-primary transition-all">FB</a>
                                <a href="https://github.com/muhtasim-rahman" class="hover:text-primary transition-all">GH</a>
                                <a href="https://linkedin.com/in/mdturzo999" class="hover:text-primary transition-all">IN</a>
                            </div>
                        </div>
                    </div>
                </div>

                <form id="contact-form" class="space-y-4">
                    <div class="space-y-1">
                        <label class="text-sm font-medium">Full Name</label>
                        <input type="text" class="w-full p-3 rounded-lg border dark:bg-gray-800 dark:border-gray-700 focus:ring-2 ring-primary outline-none transition-all" placeholder="John Doe">
                    </div>
                    <div class="space-y-1">
                        <label class="text-sm font-medium">Email Address</label>
                        <input type="email" class="w-full p-3 rounded-lg border dark:bg-gray-800 dark:border-gray-700 focus:ring-2 ring-primary outline-none transition-all" placeholder="john@example.com">
                    </div>
                    <div class="space-y-1">
                        <label class="text-sm font-medium">Message</label>
                        <textarea class="w-full p-3 h-32 rounded-lg border dark:bg-gray-800 dark:border-gray-700 focus:ring-2 ring-primary outline-none transition-all" placeholder="Tell me about your project..."></textarea>
                    </div>
                    <button type="submit" class="w-full bg-primary text-white py-3 rounded-lg font-bold hover:shadow-lg transition-all">Send Message</button>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
