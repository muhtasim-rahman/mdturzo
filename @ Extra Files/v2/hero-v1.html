<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muhtasim Rahman — Hero Section</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    /* ============================================================
       CSS VARIABLES
    ============================================================ */
    :root {
      --clr-primary-400: #60A5FA;
      --clr-primary-500: #3B82F6;
      --clr-primary-600: #2563EB;
      --clr-primary-700: #1D4ED8;
      --clr-neutral-0: #FFFFFF;
      --clr-neutral-50: #F8FAFC;
      --clr-neutral-100: #F1F5F9;
      --clr-neutral-200: #E2E8F0;
      --clr-neutral-300: #CBD5E1;
      --clr-neutral-400: #94A3B8;
      --clr-neutral-500: #64748B;
      --clr-neutral-600: #475569;
      --clr-neutral-700: #334155;
      --clr-neutral-800: #1E293B;
      --clr-neutral-900: #0F172A;
      --clr-neutral-950: #020617;
      --font-display: 'Plus Jakarta Sans', sans-serif;
      --font-body: 'DM Sans', sans-serif;
      --font-mono: 'DM Mono', monospace;
      --text-xs: 0.75rem;
      --text-sm: 0.875rem;
      --text-base: 1rem;
      --text-lg: 1.125rem;
      --text-xl: 1.25rem;
      --text-2xl: 1.5rem;
      --fw-medium: 500;
      --fw-semibold: 600;
      --fw-bold: 700;
      --fw-extrabold: 800;
      --ls-tight: -0.025em;
      --ls-wide: 0.025em;
      --ls-wider: 0.05em;
      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;
      --radius-xl: 1rem;
      --radius-full: 9999px;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --space-10: 2.5rem;
      --space-12: 3rem;
      --transition-fast: 150ms ease;
      --transition-base: 250ms ease;
      --transition-slow: 400ms ease;
      --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
      --container-xl: 1280px;
      --container-pad: clamp(1rem, 4vw, 2rem);
    }

    /* Light theme */
    [data-theme="light"] {
      --bg-page: var(--clr-neutral-50);
      --bg-surface: var(--clr-neutral-0);
      --bg-surface-2: var(--clr-neutral-100);
      --text-primary: var(--clr-neutral-900);
      --text-secondary: var(--clr-neutral-600);
      --text-tertiary: var(--clr-neutral-400);
      --border-color: var(--clr-neutral-200);
      --accent-primary: var(--clr-primary-600);
      --accent-hover: var(--clr-primary-700);
      --accent-light: var(--clr-primary-50, #EFF6FF);
    }

    /* Dark theme */
    [data-theme="dark"] {
      --bg-page: var(--clr-neutral-950);
      --bg-surface: var(--clr-neutral-900);
      --bg-surface-2: var(--clr-neutral-800);
      --text-primary: var(--clr-neutral-50);
      --text-secondary: var(--clr-neutral-400);
      --text-tertiary: var(--clr-neutral-500);
      --border-color: var(--clr-neutral-800);
      --accent-primary: var(--clr-primary-500);
      --accent-hover: var(--clr-primary-400);
      --accent-light: rgba(59, 130, 246, 0.12);
      --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.4), 0 8px 10px -6px rgb(0 0 0 / 0.3);
    }

    /* ============================================================
       RESET + BASE
    ============================================================ */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-body);
      font-size: var(--text-base);
      font-weight: 400;
      line-height: 1.5;
      color: var(--text-primary);
      background-color: var(--bg-page);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color var(--transition-slow), color var(--transition-slow);
    }

    img,
    svg {
      display: block;
      max-width: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      font: inherit;
    }

    /* ============================================================
       BUTTONS
    ============================================================ */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      padding: 0.625rem 1.375rem;
      font-family: var(--font-display);
      font-size: var(--text-sm);
      font-weight: var(--fw-semibold);
      letter-spacing: var(--ls-wide);
      border-radius: var(--radius-lg);
      border: 2px solid transparent;
      cursor: pointer;
      transition: all var(--transition-base);
      white-space: nowrap;
      user-select: none;
      text-decoration: none;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: currentColor;
      opacity: 0;
      transition: opacity var(--transition-fast);
    }

    .btn:hover::before {
      opacity: 0.08;
    }

    .btn:active::before {
      opacity: 0.15;
    }

    .btn--primary {
      background: var(--accent-primary);
      color: #fff;
      border-color: var(--accent-primary);
      box-shadow: 0 2px 8px rgb(37 99 235 / 0.25);
    }

    .btn--primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
      box-shadow: 0 4px 16px rgb(37 99 235 / 0.35);
      transform: translateY(-1px);
    }

    .btn--outline {
      background: transparent;
      color: var(--accent-primary);
      border-color: var(--accent-primary);
    }

    .btn--outline:hover {
      background: var(--accent-light);
      transform: translateY(-1px);
    }

    /* ============================================================
       THEME TOGGLE BUTTON (top-right)
    ============================================================ */
    #theme-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 999;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
      transition: all var(--transition-base);
    }

    #theme-toggle:hover {
      color: var(--accent-primary);
      transform: scale(1.08);
    }

    /* ============================================================
       HERO — v1.4.5
    ============================================================ */
    .hero {
      position: relative;
      height: 100dvh;
      max-height: 840px;
      min-height: 600px;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    /* Background noise + orbs */
    .hero__bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        radial-gradient(rgba(255, 255, 255, 0.055) 1px, transparent 1px),
        radial-gradient(rgba(59, 130, 246, 0.04) 1px, transparent 1px);
      background-size: 32px 32px, 17px 17px;
      background-position: 0 0, 8px 8px;
      mask-image: radial-gradient(ellipse 90% 90% at 50% 40%, black 20%, transparent 85%);
      animation: bg-drift 40s linear infinite;
    }

    [data-theme="light"] .hero__bg {
      background-image:
        radial-gradient(rgba(37, 99, 235, 0.07) 1px, transparent 1px),
        radial-gradient(rgba(99, 102, 241, 0.05) 1px, transparent 1px);
      background-size: 32px 32px, 17px 17px;
    }

    @keyframes bg-drift {
      to {
        background-position: 32px 32px, 25px 25px;
      }
    }

    /* Orbs */
    .hero__orb {
      position: absolute;
      z-index: 0;
      pointer-events: none;
      border-radius: 50%;
      filter: blur(72px);
      animation: orb-drift var(--dur, 20s) ease-in-out var(--del, 0s) infinite alternate;
    }

    .hero__orb--1 {
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.20) 0%, transparent 68%);
      top: -100px;
      left: -80px;
      --dur: 22s;
      --del: 0s;
    }

    .hero__orb--2 {
      width: 360px;
      height: 360px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.14) 0%, transparent 68%);
      bottom: -80px;
      right: 8%;
      --dur: 17s;
      --del: 5s;
    }

    .hero__orb--3 {
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.10) 0%, transparent 68%);
      top: 38%;
      left: 32%;
      --dur: 26s;
      --del: 9s;
    }

    [data-theme="light"] .hero__orb--1 {
      background: radial-gradient(circle, rgba(37, 99, 235, 0.08) 0%, transparent 68%);
    }

    [data-theme="light"] .hero__orb--2 {
      background: radial-gradient(circle, rgba(99, 102, 241, 0.06) 0%, transparent 68%);
    }

    [data-theme="light"] .hero__orb--3 {
      background: radial-gradient(circle, rgba(59, 130, 246, 0.04) 0%, transparent 68%);
    }

    @keyframes orb-drift {
      0% {
        transform: translate(0, 0) scale(1);
      }

      33% {
        transform: translate(28px, -18px) scale(1.07);
      }

      66% {
        transform: translate(-18px, 22px) scale(0.94);
      }

      100% {
        transform: translate(12px, -8px) scale(1.02);
      }
    }

    /* Stars */
    .hero__stars {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .hero__star {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.6);
      animation: star-twinkle var(--dur, 3s) ease-in-out var(--del, 0s) infinite;
    }

    [data-theme="light"] .hero__star {
      background: var(--clr-primary-400);
      opacity: 0.12;
    }

    @keyframes star-twinkle {

      0%,
      100% {
        opacity: var(--op-lo, 0.1);
        transform: scale(1);
      }

      50% {
        opacity: var(--op-hi, 0.5);
        transform: scale(1.5);
      }
    }

    /* Rising particles */
    .hero__particles {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .hero__particle {
      position: absolute;
      bottom: -10px;
      font-size: var(--ps, 0.7rem);
      color: var(--pc, rgba(59, 130, 246, 0.45));
      line-height: 1;
      user-select: none;
      animation: particle-rise var(--pd, 8s) ease-in var(--pp, 0s) infinite;
      opacity: 0;
    }

    [data-theme="light"] .hero__particle {
      color: var(--pc-l, rgba(37, 99, 235, 0.3));
    }

    @keyframes particle-rise {
      0% {
        opacity: 0;
        transform: translateY(0) translateX(0) rotate(0deg) scale(1);
      }

      10% {
        opacity: var(--po, 0.55);
      }

      80% {
        opacity: calc(var(--po, 0.55)*0.15);
      }

      100% {
        opacity: 0;
        transform: translateY(-95vh) translateX(var(--px, 20px)) rotate(var(--pr, 180deg)) scale(0.4);
      }
    }

    /* Inner grid */
    .hero__inner {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 3fr 2fr;
      gap: clamp(1.5rem, 4vw, 3.5rem);
      align-items: center;
      width: 100%;
      height: 100%;
      max-width: var(--container-xl);
      margin-inline: auto;
      padding-inline: var(--container-pad);
      padding-block: clamp(var(--space-8), 4vh, var(--space-12));
    }

    /* Content (left) */
    .hero__content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(var(--space-3), 2vh, var(--space-5));
      height: 100%;
    }

    /* Chip */
    .hero__chip {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      padding: 0.3em 0.9em;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: var(--radius-full);
      font-size: var(--text-xs);
      font-family: var(--font-mono);
      color: var(--text-tertiary);
      letter-spacing: 0.05em;
      width: fit-content;
      backdrop-filter: blur(10px);
    }

    [data-theme="light"] .hero__chip {
      background: var(--bg-surface);
      border-color: var(--border-color);
      color: var(--text-secondary);
    }

    .hero__chip-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.25);
      animation: chip-pulse 2s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes chip-pulse {

      0%,
      100% {
        box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.25);
      }

      50% {
        box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.06);
      }
    }

    /* Name */
    .hero__name {
      font-size: clamp(2.4rem, 4.8vw, 4.5rem);
      font-weight: var(--fw-extrabold);
      line-height: 1.03;
      letter-spacing: -0.03em;
      font-family: var(--font-display);
      color: var(--text-primary);
    }

    .hero__name-line {
      display: block;
      overflow: hidden;
      line-height: 1.15;
    }

    .hero__name-inner {
      display: inline-block;
      transform: translateY(105%);
      animation: name-up 0.7s cubic-bezier(0.16, 1, 0.3, 1) var(--d, 0ms) forwards;
    }

    @keyframes name-up {
      to {
        transform: translateY(0);
      }
    }

    .hero__name-accent {
      color: var(--accent-primary);
    }

    .hero__name-nick {
      font-size: 0.33em;
      font-weight: var(--fw-medium);
      color: var(--text-tertiary);
      letter-spacing: 0.03em;
      vertical-align: middle;
      font-family: var(--font-mono);
      margin-left: 0.45em;
      opacity: 0;
      animation: hero-fade 0.5s ease 1s forwards;
    }

    @keyframes hero-fade {
      to {
        opacity: 1;
      }
    }

    /* Role / typing */
    .hero__role {
      font-size: clamp(0.9rem, 1.6vw, var(--text-xl));
      color: var(--text-secondary);
      font-weight: var(--fw-medium);
      min-height: 1.7em;
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .hero__role-typed {
      color: var(--text-primary);
      font-weight: var(--fw-semibold);
    }

    .hero__cursor {
      color: var(--accent-primary);
      animation: blink 0.7s step-end infinite;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0;
      }
    }

    /* Bio */
    .hero__bio {
      font-size: clamp(0.875rem, 1.25vw, var(--text-base));
      color: var(--text-secondary);
      line-height: 1.7;
      max-width: 460px;
    }

    /* CTA */
    .hero__cta {
      display: flex;
      gap: var(--space-3);
      flex-wrap: wrap;
    }

    /* Socials */
    .hero__socials {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      flex-wrap: wrap;
    }

    .hero__social-link {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(148, 163, 184, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-tertiary);
      font-size: 0.82rem;
      text-decoration: none;
      transition: all var(--transition-fast);
      backdrop-filter: blur(8px);
    }

    [data-theme="light"] .hero__social-link {
      background: var(--bg-surface);
      border-color: var(--border-color);
    }

    .hero__social-link:hover {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
      color: #fff;
      transform: translateY(-2px);
    }

    /* Stats */
    .hero__stats {
      display: flex;
      align-items: center;
      gap: var(--space-5);
      flex-wrap: wrap;
    }

    .hero__stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .hero__stat-num {
      display: flex;
      align-items: baseline;
      gap: 1px;
      font-size: clamp(var(--text-xl), 2vw, var(--text-2xl));
      font-weight: var(--fw-extrabold);
      font-family: var(--font-display);
      color: var(--text-primary);
      line-height: 1;
    }

    .hero__stat-plus {
      color: var(--accent-primary);
    }

    .hero__stat-lbl {
      font-size: 0.63rem;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: var(--ls-wider);
    }

    .hero__stat-sep {
      width: 1px;
      height: 28px;
      background: var(--border-color);
      flex-shrink: 0;
    }

    /* Fade-up utility */
    .hero-up {
      opacity: 0;
      animation: fade-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) var(--d, 0ms) forwards;
    }

    @keyframes fade-up {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Visual (right) */
    .hero__visual {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      opacity: 0;
      animation: visual-in 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
    }

    @keyframes visual-in {
      from {
        opacity: 0;
        transform: translateX(20px) scale(0.94);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    /* Photo scene */
    .hero__photo-scene {
      position: relative;
      width: min(90%, clamp(200px, 24vw, 300px));
      height: clamp(360px, min(72vh, calc(100% - 20px)), 680px);
      flex-shrink: 0;
      container-type: size;
    }

    .hero__photo-glow {
      position: absolute;
      inset: 4% 8%;
      z-index: 0;
      border-radius: 50%;
      background: radial-gradient(ellipse at 50% 40%, rgba(37, 99, 235, 0.22) 0%, transparent 70%);
      filter: blur(36px);
      pointer-events: none;
      animation: glow-pulse 4s ease-in-out infinite;
    }

    [data-theme="light"] .hero__photo-glow {
      background: radial-gradient(ellipse at 50% 40%, rgba(37, 99, 235, 0.10) 0%, transparent 70%);
    }

    @keyframes glow-pulse {

      0%,
      100% {
        opacity: 0.7;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.1);
      }
    }

    .hero__photo-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
    }

    .hero__photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
      filter: drop-shadow(0 10px 36px rgba(0, 0, 0, 0.22));
    }

    [data-theme="dark"] .hero__photo {
      filter: drop-shadow(0 10px 36px rgba(0, 0, 0, 0.45));
    }

    /* Futuristic bottom bar */
    .hero__photo-bottom {
      position: absolute;
      bottom: 0;
      left: -15%;
      right: -15%;
      z-index: 4;
      pointer-events: none;
    }

    .hero__photo-bottom::before {
      content: '';
      display: block;
      height: clamp(80px, 22%, 160px);
      background: linear-gradient(to top, var(--bg-page) 0%, var(--bg-page) 12%, rgba(10, 14, 27, 0.88) 38%, rgba(10, 14, 27, 0.42) 60%, transparent 100%);
      margin-bottom: -1px;
    }

    [data-theme="light"] .hero__photo-bottom::before {
      background: linear-gradient(to top, var(--bg-page) 0%, var(--bg-page) 10%, rgba(248, 250, 252, 0.92) 36%, rgba(248, 250, 252, 0.45) 58%, transparent 100%);
    }

    .hero__photo-bottom::after {
      content: '';
      display: block;
      height: 1.5px;
      width: 100%;
      background: linear-gradient(90deg, transparent 0%, rgba(99, 102, 241, 0.25) 12%, rgba(59, 130, 246, 0.7) 30%, rgba(147, 197, 253, 0.9) 48%, rgba(59, 130, 246, 0.7) 66%, rgba(99, 102, 241, 0.25) 88%, transparent 100%);
      box-shadow: 0 0 8px rgba(59, 130, 246, 0.6), 0 0 22px rgba(59, 130, 246, 0.3), 0 0 48px rgba(59, 130, 246, 0.12);
      animation: hr-pulse 3s ease-in-out infinite;
    }

    [data-theme="light"] .hero__photo-bottom::after {
      background: linear-gradient(90deg, transparent 0%, rgba(37, 99, 235, 0.18) 15%, rgba(37, 99, 235, 0.55) 40%, rgba(37, 99, 235, 0.75) 50%, rgba(37, 99, 235, 0.55) 62%, rgba(37, 99, 235, 0.18) 85%, transparent 100%);
      box-shadow: 0 0 6px rgba(37, 99, 235, 0.25), 0 0 16px rgba(37, 99, 235, 0.12);
    }

    @keyframes hr-pulse {

      0%,
      100% {
        opacity: 0.75;
      }

      50% {
        opacity: 1;
      }
    }

    /* HR dots */
    .hero__photo-hr-dots {
      position: absolute;
      bottom: -3px;
      left: -15%;
      right: -15%;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      padding-inline: 12%;
    }

    .hero__photo-hr-dots span {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--clr-primary-400);
      box-shadow: 0 0 6px var(--clr-primary-400), 0 0 12px rgba(59, 130, 246, 0.5);
      animation: dot-blink 2s ease-in-out var(--dd, 0s) infinite;
      flex-shrink: 0;
    }

    @keyframes dot-blink {

      0%,
      100% {
        opacity: 0.4;
      }

      50% {
        opacity: 1;
      }
    }

    /* Floating icons */
    .hero__icon {
      position: absolute;
      z-index: 5;
      width: var(--sz, 46px);
      height: var(--sz, 46px);
      border-radius: 14px;
      background: rgba(11, 17, 36, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.18);
      box-shadow: 0 4px 22px rgba(0, 0, 0, 0.28), 0 0 0 1px rgba(255, 255, 255, 0.04) inset;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      backdrop-filter: blur(14px) saturate(160%);
      animation: icon-float var(--dur, 3.5s) ease-in-out var(--del, 0s) infinite;
    }

    [data-theme="light"] .hero__icon {
      background: rgba(255, 255, 255, 0.92);
      border-color: rgba(226, 232, 240, 0.8);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.04);
    }

    .hero__icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    @keyframes icon-float {

      0%,
      100% {
        transform: translateY(0) rotate(0deg);
      }

      40% {
        transform: translateY(-11px) rotate(4deg);
      }

      70% {
        transform: translateY(5px) rotate(-2.5deg);
      }
    }

    .hero__icon--html {
      --sz: 48px;
      top: 12%;
      left: -24px;
      --dur: 3.9s;
      --del: 0s;
    }

    .hero__icon--css {
      --sz: 42px;
      top: 38%;
      left: -21px;
      --dur: 4.4s;
      --del: 0.65s;
    }

    .hero__icon--python {
      --sz: 42px;
      top: 63%;
      left: -20px;
      --dur: 3.6s;
      --del: 1.2s;
    }

    .hero__icon--vscode {
      --sz: 46px;
      top: 8%;
      right: -23px;
      --dur: 3.3s;
      --del: 0.95s;
    }

    .hero__icon--design {
      --sz: 38px;
      top: 44%;
      right: -19px;
      --dur: 4.8s;
      --del: 0.35s;
    }

    /* Scroll button */
    .hero__scroll {
      position: absolute;
      bottom: 1.4rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: var(--text-tertiary);
      font-size: 0.58rem;
      font-family: var(--font-mono);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      z-index: 6;
      animation: scroll-hint 2.5s ease-in-out infinite;
      transition: color var(--transition-fast);
    }

    .hero__scroll:hover {
      color: var(--accent-primary);
    }

    .hero__scroll i {
      font-size: 0.65rem;
    }

    @keyframes scroll-hint {

      0%,
      100% {
        transform: translateX(-50%) translateY(0);
        opacity: 0.38;
      }

      50% {
        transform: translateX(-50%) translateY(5px);
        opacity: 0.88;
      }
    }

    /* ============================================================
       RESPONSIVE — Tablet ≤900px
    ============================================================ */
    @media (max-width:900px) {
      .hero {
        height: auto;
        max-height: none;
        min-height: 100dvh;
      }

      .hero__inner {
        grid-template-columns: 1fr;
        padding-block: var(--space-8) var(--space-12);
        gap: var(--space-5);
        text-align: center;
        align-items: start;
      }

      .hero__content {
        align-items: center;
        order: 2;
        justify-content: flex-start;
        gap: var(--space-4);
        height: auto;
      }

      .hero__visual {
        order: 1;
        height: auto;
        justify-content: center;
      }

      .hero__bio {
        max-width: 76%;
        text-align: center;
      }

      .hero__cta,
      .hero__socials,
      .hero__stats {
        justify-content: center;
      }

      .hero__chip {
        align-self: center;
      }

      .hero__photo-scene {
        width: clamp(160px, 44vw, 240px);
        height: clamp(220px, 54vw, 320px);
      }

      .hero__photo-wrap {
        border-radius: clamp(16px, 5vw, 28px);
        overflow: hidden;
        box-shadow: 0 0 0 3px var(--bg-page), 0 0 0 5px var(--border-color), var(--shadow-xl);
      }

      .hero__photo-glow {
        border-radius: clamp(16px, 5vw, 28px);
      }

      .hero__photo-bottom,
      .hero__photo-hr-dots {
        display: none;
      }

      .hero__icon--html {
        --sz: 38px;
        top: -14px;
        left: 6%;
      }

      .hero__icon--css {
        --sz: 34px;
        top: -14px;
        right: 6%;
        left: auto;
      }

      .hero__icon--python {
        --sz: 34px;
        top: 50%;
        left: -13px;
        transform: translateY(-50%);
        animation-name: icon-float-y;
      }

      .hero__icon--vscode {
        --sz: 38px;
        top: 50%;
        right: -13px;
        left: auto;
        transform: translateY(-50%);
        animation-name: icon-float-y;
      }

      .hero__icon--design {
        display: none;
      }

      .hero__scroll {
        display: none;
      }
    }

    @keyframes icon-float-y {

      0%,
      100% {
        transform: translateY(-50%) rotate(0deg);
      }

      50% {
        transform: translateY(calc(-50% - 9px)) rotate(4deg);
      }
    }

    /* ============================================================
       RESPONSIVE — Mobile ≤520px
    ============================================================ */
    @media (max-width:520px) {
      .hero__inner {
        padding-block: var(--space-6) var(--space-10);
        gap: var(--space-4);
      }

      .hero__photo-scene {
        width: 156px;
        height: 156px;
      }

      .hero__photo-wrap {
        border-radius: 50%;
        overflow: hidden;
        box-shadow: 0 0 0 4px var(--bg-page), 0 0 0 6px var(--border-color), 0 0 30px rgba(37, 99, 235, 0.14);
        animation: ring-pulse 3s ease-in-out infinite;
      }

      @keyframes ring-pulse {

        0%,
        100% {
          box-shadow: 0 0 0 4px var(--bg-page), 0 0 0 6px var(--border-color), 0 0 20px rgba(37, 99, 235, 0.1);
        }

        50% {
          box-shadow: 0 0 0 4px var(--bg-page), 0 0 0 6px var(--clr-primary-400), 0 0 34px rgba(37, 99, 235, 0.24);
        }
      }

      .hero__photo-glow {
        inset: 0;
        border-radius: 50%;
      }

      .hero__name {
        font-size: clamp(1.95rem, 9vw, 2.65rem);
      }

      .hero__bio {
        max-width: 90%;
        font-size: 0.845rem;
      }

      .hero__icon {
        --sz: 34px !important;
        padding: 7px;
        border-radius: 10px;
      }

      .hero__icon--html {
        top: -11px;
        left: 5%;
      }

      .hero__icon--css {
        top: -11px;
        right: 5%;
        left: auto;
      }

      .hero__icon--python {
        top: 50%;
        left: -13px;
      }

      .hero__icon--vscode {
        top: 50%;
        right: -13px;
        left: auto;
      }

      .hero__icon--design {
        display: none;
      }
    }

    /* ============================================================
       RESPONSIVE — Large ≥1400px
    ============================================================ */
    @media (min-width:1400px) {
      .hero__photo-scene {
        width: clamp(270px, 20vw, 320px);
      }
    }

    @media (min-height:900px) and (min-width:901px) {
      .hero {
        max-height: 900px;
      }

      .hero__photo-scene {
        height: clamp(480px, 72vh, 680px);
      }
    }
  </style>
</head>

<body>

  <!-- Theme Toggle -->
  <button id="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
    <i class="fa-solid fa-moon" id="theme-icon"></i>
  </button>

  <!-- Hero Section will be injected here -->
  <div id="hero-root"></div>

  <script>
    // ============================================================
    // HERO JS — v1.4.5 (standalone)
    // ============================================================
    const SITE_CONFIG = {
      social: {
        github: 'https://github.com/muhtasim-rahman',
        linkedin: 'https://linkedin.com/in/mdturzo999',
        facebook: 'https://facebook.com/mdturzo999',
        instagram: 'https://instagram.com/mdturzo999',
        youtube: 'https://youtube.com/@mdturzo999',
        telegram: 'https://t.me/mdturzo16',
      }
    };
    const BASE = 'https://mdturzo.web.app';
    const ROLES = ['Web Developer', 'UI/UX Designer', 'Graphic Designer', 'Video Editor'];
    const ICONS = [{
        file: 'html5',
        label: 'HTML5',
        cls: 'html',
        dur: '3.9s',
        del: '0s'
      },
      {
        file: 'css3',
        label: 'CSS3',
        cls: 'css',
        dur: '4.4s',
        del: '0.65s'
      },
      {
        file: 'python',
        label: 'Python',
        cls: 'python',
        dur: '3.6s',
        del: '1.2s'
      },
      {
        file: 'vscode',
        label: 'VSCode',
        cls: 'vscode',
        dur: '3.3s',
        del: '0.95s'
      },
      {
        file: 'design',
        label: 'Design',
        cls: 'design',
        dur: '4.8s',
        del: '0.35s'
      },
    ];
    const PARTICLE_TYPES = [{
        char: '★',
        color: 'rgba(59,130,246,VAL)',
        colorL: 'rgba(37,99,235,VAL)',
        sz: '0.65rem'
      },
      {
        char: '✦',
        color: 'rgba(99,102,241,VAL)',
        colorL: 'rgba(79,70,229,VAL)',
        sz: '0.55rem'
      },
      {
        char: '✧',
        color: 'rgba(147,197,253,VAL)',
        colorL: 'rgba(96,165,250,VAL)',
        sz: '0.5rem'
      },
      {
        char: '♥',
        color: 'rgba(248,113,113,VAL)',
        colorL: 'rgba(239,68,68,VAL)',
        sz: '0.52rem'
      },
      {
        char: '♡',
        color: 'rgba(251,146,60,VAL)',
        colorL: 'rgba(249,115,22,VAL)',
        sz: '0.56rem'
      },
      {
        char: '·',
        color: 'rgba(255,255,255,VAL)',
        colorL: 'rgba(37,99,235,VAL)',
        sz: '0.7rem'
      },
      {
        char: '◆',
        color: 'rgba(139,92,246,VAL)',
        colorL: 'rgba(124,58,237,VAL)',
        sz: '0.45rem'
      },
      {
        char: '✿',
        color: 'rgba(52,211,153,VAL)',
        colorL: 'rgba(16,185,129,VAL)',
        sz: '0.52rem'
      },
      {
        char: '+',
        color: 'rgba(59,130,246,VAL)',
        colorL: 'rgba(37,99,235,VAL)',
        sz: '0.6rem'
      },
      {
        char: '✺',
        color: 'rgba(251,191,36,VAL)',
        colorL: 'rgba(245,158,11,VAL)',
        sz: '0.5rem'
      },
      {
        char: '⊹',
        color: 'rgba(147,197,253,VAL)',
        colorL: 'rgba(96,165,250,VAL)',
        sz: '0.6rem'
      },
      {
        char: '◌',
        color: 'rgba(99,102,241,VAL)',
        colorL: 'rgba(79,70,229,VAL)',
        sz: '0.58rem'
      },
    ];
    const buildParticles = () => {
      const out = [];
      for (let i = 0; i < 48; i++) {
        const pt = PARTICLE_TYPES[i % PARTICLE_TYPES.length];
        const op = (0.28 + Math.random() * 0.45).toFixed(2);
        const dur = (6 + Math.random() * 10).toFixed(1) + 's';
        const del = (Math.random() * 16).toFixed(1) + 's';
        const left = (2 + Math.random() * 96).toFixed(1) + '%';
        const px = ((Math.random() - 0.5) * 80).toFixed(0) + 'px';
        const pr = ((Math.random() - 0.5) * 360).toFixed(0) + 'deg';
        const c = pt.color.replace('VAL', op);
        const cl = pt.colorL.replace('VAL', op);
        out.push(`<span class="hero__particle" style="left:${left};--pd:${dur};--pp:${del};--po:${op};--ps:${pt.sz};--px:${px};--pr:${pr};--pc:${c};--pc-l:${cl};" aria-hidden="true">${pt.char}</span>`);
      }
      return out.join('');
    };
    const buildStars = () => {
      const out = [];
      for (let i = 0; i < 52; i++) {
        const sz = Math.random() < 0.7 ? 1 : Math.random() < 0.8 ? 2 : 3;
        const x = (Math.random() * 100).toFixed(1);
        const y = (Math.random() * 100).toFixed(1);
        const dur = (2 + Math.random() * 5).toFixed(1) + 's';
        const del = (Math.random() * 7).toFixed(1) + 's';
        const opLo = (0.06 + Math.random() * 0.14).toFixed(2);
        const opHi = (0.25 + Math.random() * 0.45).toFixed(2);
        out.push(`<span class="hero__star" style="width:${sz}px;height:${sz}px;left:${x}%;top:${y}%;--dur:${dur};--del:${del};--op-lo:${opLo};--op-hi:${opHi};" aria-hidden="true"></span>`);
      }
      return out.join('');
    };
    const buildIcon = ic =>
      `<div class="hero__icon hero__icon--${ic.cls}" style="--dur:${ic.dur};--del:${ic.del};" title="${ic.label}" aria-label="${ic.label}">
         <img src="${BASE}/assets/images/icons/${ic.file}.svg" alt="${ic.label}" loading="lazy"/>
       </div>`;
    const soc = SITE_CONFIG.social;
    const heroHTML = `
      <section class="hero" id="hero" aria-label="Introduction">

        <div class="hero__bg" aria-hidden="true"></div>
        <div class="hero__stars" aria-hidden="true">${buildStars()}</div>
        <div class="hero__orb hero__orb--1" aria-hidden="true"></div>
        <div class="hero__orb hero__orb--2" aria-hidden="true"></div>
        <div class="hero__orb hero__orb--3" aria-hidden="true"></div>
        <div class="hero__particles" aria-hidden="true">${buildParticles()}</div>

        <div class="hero__inner">

          <!-- Left content -->
          <div class="hero__content">

            <div class="hero__chip hero-up" style="--d:0ms">
              <span class="hero__chip-dot" aria-hidden="true"></span>
              Available for work
            </div>

            <h1 class="hero__name" aria-label="Muhtasim Rahman, Turzo">
              <span class="hero__name-line">
                <span class="hero__name-inner" style="--d:80ms">Muhtasim</span>
              </span>
              <span class="hero__name-line">
                <span class="hero__name-inner hero__name-accent" style="--d:190ms">
                  Rahman<span class="hero__name-nick">(Turzo)</span>
                </span>
              </span>
            </h1>

            <div class="hero__role hero-up" style="--d:350ms" aria-live="polite">
              <span id="hero-typed" class="hero__role-typed"></span>
              <span class="hero__cursor" aria-hidden="true">|</span>
            </div>

            <p class="hero__bio hero-up" style="--d:460ms">
              Self-taught developer &amp; designer from Bangladesh —
              building clean, fast and meaningful digital experiences.
            </p>

            <div class="hero__cta hero-up" style="--d:560ms">
              <a href="#" class="btn btn--primary">
                <i class="fa-solid fa-paper-plane" aria-hidden="true"></i> Hire Me
              </a>
              <a href="#" class="btn btn--outline" id="hero-cv-btn">
                <i class="fa-solid fa-file-arrow-down" aria-hidden="true"></i> Download CV
              </a>
            </div>

            <div class="hero__socials hero-up" style="--d:660ms" aria-label="Social links">
              <a href="${soc.github}"    target="_blank" rel="noopener noreferrer" class="hero__social-link" aria-label="GitHub">   <i class="fa-brands fa-github"      aria-hidden="true"></i></a>
              <a href="${soc.linkedin}"  target="_blank" rel="noopener noreferrer" class="hero__social-link" aria-label="LinkedIn">  <i class="fa-brands fa-linkedin-in" aria-hidden="true"></i></a>
              <a href="${soc.facebook}"  target="_blank" rel="noopener noreferrer" class="hero__social-link" aria-label="Facebook">  <i class="fa-brands fa-facebook-f"  aria-hidden="true"></i></a>
              <a href="${soc.instagram}" target="_blank" rel="noopener noreferrer" class="hero__social-link" aria-label="Instagram"> <i class="fa-brands fa-instagram"   aria-hidden="true"></i></a>
              <a href="${soc.youtube}"   target="_blank" rel="noopener noreferrer" class="hero__social-link" aria-label="YouTube">   <i class="fa-brands fa-youtube"     aria-hidden="true"></i></a>
              <a href="${soc.telegram}"  target="_blank" rel="noopener noreferrer" class="hero__social-link" aria-label="Telegram">  <i class="fa-brands fa-telegram"    aria-hidden="true"></i></a>
            </div>

            <div class="hero__stats hero-up" style="--d:750ms" aria-label="Stats">
              <div class="hero__stat">
                <div class="hero__stat-num"><span class="hero__stat-val" data-count="3">0</span><span class="hero__stat-plus">+</span></div>
                <span class="hero__stat-lbl">Yrs Dev</span>
              </div>
              <div class="hero__stat-sep" aria-hidden="true"></div>
              <div class="hero__stat">
                <div class="hero__stat-num"><span class="hero__stat-val" data-count="6">0</span><span class="hero__stat-plus">+</span></div>
                <span class="hero__stat-lbl">Yrs Design</span>
              </div>
              <div class="hero__stat-sep" aria-hidden="true"></div>
              <div class="hero__stat">
                <div class="hero__stat-num"><span class="hero__stat-val" data-count="16">0</span><span class="hero__stat-plus">+</span></div>
                <span class="hero__stat-lbl">Projects</span>
              </div>
            </div>

          </div>

          <!-- Right visual -->
          <div class="hero__visual" aria-hidden="true">
            <div class="hero__photo-scene">

              <div class="hero__photo-glow"></div>

              <div class="hero__photo-wrap">
                <img
                  src="https://i.ibb.co.com/SDCBD189/hero.webp"
                  alt="Muhtasim Rahman"
                  class="hero__photo"
                  loading="eager"
                  fetchpriority="high"
                  width="300"
                  height="640"
                />
              </div>

              <div class="hero__photo-bottom" aria-hidden="true">
                <div class="hero__photo-hr-dots">
                  <span style="--dd:0s"></span>
                  <span style="--dd:0.4s"></span>
                  <span style="--dd:0.8s"></span>
                </div>
              </div>

              ${ICONS.map(buildIcon).join('')}

            </div>
          </div>

        </div>

        <button class="hero__scroll" id="hero-scroll-btn" aria-label="Scroll down" type="button">
          <span>Scroll</span>
          <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
        </button>

      </section>
    `;
    document.getElementById('hero-root').innerHTML = heroHTML;
    // ── Typing effect ───────────────────────────────────────────
    (() => {
      const el = document.getElementById('hero-typed');
      if (!el) return;
      let ri = 0,
        ci = 0,
        del = false;
      const tick = () => {
        const cur = ROLES[ri];
        if (!del) {
          el.textContent = cur.slice(0, ++ci);
          if (ci === cur.length) {
            del = true;
            return setTimeout(tick, 2100);
          }
          setTimeout(tick, 70);
        } else {
          el.textContent = cur.slice(0, --ci);
          if (ci === 0) {
            del = false;
            ri = (ri + 1) % ROLES.length;
            return setTimeout(tick, 280);
          }
          setTimeout(tick, 34);
        }
      };
      setTimeout(tick, 1050);
    })();
    // ── Counter animation ───────────────────────────────────────
    (() => {
      const animateCounter = (el, target, duration) => {
        const start = performance.now();
        const update = (now) => {
          const t = Math.min((now - start) / duration, 1);
          const ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
          el.textContent = Math.round(ease * target);
          if (t < 1) requestAnimationFrame(update);
          else el.textContent = target;
        };
        requestAnimationFrame(update);
      };
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            const el = e.target;
            animateCounter(el, +el.dataset.count, 900);
            observer.unobserve(el);
          }
        });
      }, {
        threshold: 0.1
      });
      document.querySelectorAll('.hero__stat-val[data-count]').forEach(el => observer.observe(el));
    })();
    // ── CV button ────────────────────────────────────────────────
    document.getElementById('hero-cv-btn')?.addEventListener('click', e => {
      e.preventDefault();
      alert('CV download coming soon!');
    });
    // ── Scroll button ────────────────────────────────────────────
    document.getElementById('hero-scroll-btn')?.addEventListener('click', () => {
      window.scrollBy({
        top: window.innerHeight * 0.85,
        behavior: 'smooth'
      });
    });
    // ── Theme toggle ─────────────────────────────────────────────
    (() => {
      const html = document.documentElement;
      const btn = document.getElementById('theme-toggle');
      const icon = document.getElementById('theme-icon');
      let dark = true;
      const apply = () => {
        html.setAttribute('data-theme', dark ? 'dark' : 'light');
        icon.className = dark ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
      };
      btn.addEventListener('click', () => {
        dark = !dark;
        apply();
      });
      apply();
    })();
  </script>
</body>
