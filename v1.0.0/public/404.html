<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 | Page Not Found</title>
</head>
<body>
    <main id="app">
        <section class="h-[80vh] flex flex-col items-center justify-center text-center px-4">
            <h1 class="text-9xl font-bold text-primary">404</h1>
            <h2 class="text-2xl font-semibold mt-4">Oops! Page not found</h2>

        </section>
    </main>
</body>
</html>
